openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HR Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: employees
  - name: attendance
  - name: leaves
  - name: remote-work
  - name: salary
  - name: payslips
  - name: dashboard
  - name: requests
  - name: uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change current user's password (also clears the must-change flag)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees (admin only)
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/bulk:
    post:
      operationId: bulkCreateEmployees
      tags: [employees]
      summary: Bulk create employees from CSV-parsed rows (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateEmployeesRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateEmployeesResponse"

  /users/mentionable:
    get:
      operationId: listMentionableMembers
      tags: [employees]
      summary: List members that can be mentioned (employees + admin members with profiles).
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentionableMember"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /employees/{id}/journey:
    get:
      operationId: getEmployeeJourney
      tags: [employees]
      summary: Get employee's complete journey timeline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Journey timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeJourney"

  /employees/{id}/salary-events:
    post:
      operationId: createSalaryEvent
      tags: [salary]
      summary: Add a bonus, loan, or increment for an employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryEvent"

  /employees/{id}/salary-events/{eventId}:
    patch:
      operationId: updateSalaryEvent
      tags: [salary]
      summary: Update an existing salary event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalaryEventRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryEvent"
    delete:
      operationId: deleteSalaryEvent
      tags: [salary]
      summary: Delete a salary event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /attendance/check-in:
    post:
      operationId: checkIn
      tags: [attendance]
      summary: Check in for the current day
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/check-out:
    post:
      operationId: checkOut
      tags: [attendance]
      summary: Check out for the current day
      responses:
        "200":
          description: Checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [attendance]
      summary: Get today's attendance for the current user
      responses:
        "200":
          description: Today's attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayAttendance"

  /attendance/me:
    get:
      operationId: getMyAttendance
      tags: [attendance]
      summary: Get the current user's attendance history
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: Attendance history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /attendance/employee/{id}:
    get:
      operationId: getEmployeeAttendance
      tags: [attendance]
      summary: Get an employee's attendance history (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: Attendance history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /attendance/today-summary:
    get:
      operationId: getTodayAttendanceSummary
      tags: [attendance, dashboard]
      summary: Get attendance summary for all employees on a date (admin). Defaults to today.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM-DD; defaults to today" }
      responses:
        "200":
          description: Attendance summary for the date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"

  /attendance/calendar:
    get:
      operationId: getAttendanceCalendar
      tags: [attendance]
      summary: Get an employee's attendance for a month formatted for the calendar (admin only)
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: Calendar data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCalendar"

  /attendance/override:
    post:
      operationId: overrideAttendance
      tags: [attendance]
      summary: Manually set attendance status for an employee on a date (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceOverrideRequest"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/{id}/excuse:
    post:
      operationId: setAttendanceExcused
      tags: [attendance]
      summary: Mark a late/half-day attendance row as excused or not excused (admin/HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAttendanceExcusedRequest"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/employee/{id}/lates:
    get:
      operationId: getEmployeeLateRecords
      tags: [attendance]
      summary: List an employee's late attendance rows in a month (admin/HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM; defaults to current month" }
      responses:
        "200":
          description: Late attendance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /remote-work:
    get:
      operationId: listRemoteWorkRequests
      tags: [remote-work]
      summary: List remote work requests (admin sees all, employee sees own)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Remote work requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteWorkRequest"
    post:
      operationId: createRemoteWorkRequest
      tags: [remote-work]
      summary: Submit a remote work request (employee only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemoteWorkRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWorkRequest"

  /remote-work/{id}:
    patch:
      operationId: updateRemoteWork
      tags: [remote-work]
      summary: Update a pending remote work request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRemoteWorkRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWorkRequest"
    delete:
      operationId: deleteRemoteWork
      tags: [remote-work]
      summary: Cancel a pending remote work request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /remote-work/{id}/approve:
    post:
      operationId: approveRemoteWork
      tags: [remote-work]
      summary: Approve a remote work request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWorkRequest"

  /remote-work/{id}/reject:
    post:
      operationId: rejectRemoteWork
      tags: [remote-work]
      summary: Reject a remote work request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWorkRequest"

  /leaves:
    get:
      operationId: listLeaves
      tags: [leaves]
      summary: List leave requests (admin sees all, employee sees own)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
    post:
      operationId: applyLeave
      tags: [leaves]
      summary: Apply for a leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leaves/{id}:
    patch:
      operationId: updateLeave
      tags: [leaves]
      summary: Update a pending leave request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeaveRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
    delete:
      operationId: deleteLeave
      tags: [leaves]
      summary: Cancel a pending leave request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /leaves/{id}/approve:
    post:
      operationId: approveLeave
      tags: [leaves]
      summary: Approve a leave (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leaves/{id}/reject:
    post:
      operationId: rejectLeave
      tags: [leaves]
      summary: Reject a leave (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leaves/balance:
    get:
      operationId: getMyLeaveBalance
      tags: [leaves]
      summary: Get current user's leave balance
      responses:
        "200":
          description: Leave balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveBalance"

  /payslips/generate:
    post:
      operationId: generatePayslip
      tags: [payslips]
      summary: Generate a payslip for an employee for a specific month (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePayslipRequest"
      responses:
        "201":
          description: Payslip generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payslip"

  /payslips/me:
    get:
      operationId: getMyPayslips
      tags: [payslips]
      summary: Get the current user's payslips
      responses:
        "200":
          description: Payslips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payslip"

  /payslips/employee/{id}:
    get:
      operationId: getEmployeePayslips
      tags: [payslips]
      summary: Get an employee's payslips (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payslips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payslip"

  /payslips/{id}:
    get:
      operationId: getPayslip
      tags: [payslips]
      summary: Get a single payslip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payslip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payslip"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /dashboard/employee:
    get:
      operationId: getEmployeeDashboard
      tags: [dashboard]
      summary: Employee dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDashboard"

  /feed:
    get:
      operationId: getFeed
      tags: [dashboard]
      summary: Today and upcoming birthdays/anniversaries
      responses:
        "200":
          description: Feed data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /news:
    get:
      operationId: listNewsPosts
      tags: [dashboard]
      summary: List news / announcement posts (newest first)
      responses:
        "200":
          description: News posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsPost"
    post:
      operationId: createNewsPost
      tags: [dashboard]
      summary: Create a news post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewsPostRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"
  /news/{id}:
    delete:
      operationId: deleteNewsPost
      tags: [dashboard]
      summary: Delete a news post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /requests:
    get:
      operationId: listGeneralRequests
      tags: [requests]
      summary: List general requests. Admin sees all, employee sees own.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [half_day, loan, increment, remote_work, late, resignation, other]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneralRequest"
    post:
      operationId: createGeneralRequest
      tags: [requests]
      summary: Submit a general request (employee only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGeneralRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralRequest"

  /requests/{id}:
    patch:
      operationId: updateGeneralRequest
      tags: [requests]
      summary: Update a pending general request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGeneralRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralRequest"
    delete:
      operationId: deleteGeneralRequest
      tags: [requests]
      summary: Cancel a pending general request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /requests/{id}/approve:
    post:
      operationId: approveGeneralRequest
      tags: [requests]
      summary: Approve a general request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveLoanRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralRequest"

  /loans:
    get:
      operationId: listLoans
      tags: [loans]
      summary: List all loans (admin/HR only)
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /loans/me:
    get:
      operationId: getMyLoans
      tags: [loans]
      summary: Get current user's loans
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /loans/eligibility:
    get:
      operationId: getMyLoanEligibility
      tags: [loans]
      summary: Get current user's loan eligibility
      responses:
        "200":
          description: Loan eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEligibility"

  /loans/employee/{id}:
    get:
      operationId: getEmployeeLoans
      tags: [loans]
      summary: Get loans for an employee (admin/HR or self)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /loans/{id}/cancel:
    post:
      operationId: cancelLoan
      tags: [loans]
      summary: Cancel an active loan (admin/HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /requests/{id}/reject:
    post:
      operationId: rejectGeneralRequest
      tags: [requests]
      summary: Reject a general request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralRequest"

  /employees/{id}/salary-components:
    get:
      operationId: listSalaryComponents
      tags: [salary]
      summary: List salary components for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryComponent"
    post:
      operationId: createSalaryComponent
      tags: [salary]
      summary: Add a salary component (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryComponentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryComponent"

  /employees/{id}/salary-components/{componentId}:
    patch:
      operationId: updateSalaryComponent
      tags: [salary]
      summary: Update a salary component (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: componentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalaryComponentRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryComponent"
    delete:
      operationId: deleteSalaryComponent
      tags: [salary]
      summary: Delete a salary component (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: componentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get global app settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update global app settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /uploads:
    post:
      operationId: uploadAttachment
      tags: [uploads]
      summary: Upload a file attachment (returns a public URL).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"

